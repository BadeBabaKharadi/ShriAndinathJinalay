<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>भोजन कूपन व्यवस्थापक</title><link rel="stylesheet" href="css/style.css"><style>main{max-width:1100px;margin:2rem auto;padding:1rem}.card{padding:1rem;margin:1rem 0;background:white;border-radius:12px;box-shadow:0 3px 20px #0001}input,button{padding:.7rem;margin:.3rem}table{width:100%;border-collapse:collapse}td,th{padding:.6rem;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}</style></head><body><main><h1>दीक्षा समारोह भोजन कूपन — व्यवस्थापक</h1><section class="card"><label>व्यवस्थापक कुंजी <input type="password" id="key" autocomplete="current-password"></label><button id="login">सत्यापित करें</button><p id="msg" role="status"></p></section><section class="card"><input id="filter" placeholder="नाम या मोबाइल से खोजें"><button id="refresh">रजिस्ट्रेशन देखें</button><button id="export">CSV निर्यात</button><p id="summary"></p><div class="scroll"><table><thead><tr><th>रजिस्ट्रेशन</th><th>नाम</th><th>मोबाइल</th><th>पता</th><th>कूपन</th><th>QR</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js" referrerpolicy="no-referrer"></script><script src="js/october-event-admin.js"></script><script>window.OCTOBER_KIND="food"</script></body></html>
