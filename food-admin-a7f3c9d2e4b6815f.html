<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>भोजन कूपन व्यवस्थापक</title><link rel="stylesheet" href="css/style.css"><style>main{max-width:1100px;margin:2rem auto;padding:1rem}.card{padding:1.25rem;margin:1rem 0;background:var(--white,#fff);border:1px solid var(--line,#e8dcc8);border-radius:16px;box-shadow:0 8px 24px var(--shadow,rgba(0,0,0,.06))}input,button{padding:.7rem;margin:.3rem;border-radius:8px;font:inherit}button{cursor:pointer;border:1px solid var(--line-strong,#cbb083);background:var(--bg-soft,#f9f2e8);color:var(--maroon,#6e1a14);font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:.6rem;border-bottom:1px solid var(--line,#ddd);text-align:left}.scroll{overflow:auto}#summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:1rem 0}.event-stat{padding:1rem;border-radius:12px;background:linear-gradient(135deg,#fffdf9,#fce8c9);border:1px solid var(--line,#e8dcc8)}.event-stat span{display:block;color:var(--text-soft,#6b4f36);font-size:.9rem}.event-stat strong{display:block;font-size:1.8rem;color:var(--maroon,#6e1a14)}#msg{overflow-wrap:anywhere}body{padding-bottom:90px}#navbar{margin-bottom:1rem}#footer{margin-top:2rem}@media(max-width:600px){main{padding:.6rem}h1{font-size:1.5rem}.card{padding:.8rem}}#details table{width:100%;border-collapse:collapse}#details th,#details td{padding:.7rem;border-bottom:1px solid var(--line,#ddd);text-align:left}#details th{width:35%;color:var(--maroon,#6e1a14)}@media(max-width:600px){#details th,#details td{padding:.5rem;overflow-wrap:anywhere}} </style></head><body><div id="navbar"></div><main><h1>दीक्षा समारोह भोजन कूपन — व्यवस्थापक</h1><section class="card"><label>व्यवस्थापक कुंजी <input type="password" id="key" autocomplete="current-password"></label><button id="login">सत्यापित करें</button><p id="msg" role="status"></p></section><section class="card"><input id="filter" placeholder="नाम या मोबाइल से खोजें"><button id="refresh">रजिस्ट्रेशन देखें</button><button id="export">CSV निर्यात</button><p id="summary"></p><div class="scroll"><table><thead><tr><th>रजिस्ट्रेशन</th><th>नाम</th><th>मोबाइल</th><th>पता</th><th>कूपन</th><th>कार्य</th></tr></thead><tbody id="rows"></tbody></table></div><pre id="details" hidden style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto"></pre></section></main><div id="footer"></div><script src="js/components.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js" referrerpolicy="no-referrer"></script><script src="js/october-event-admin.js"></script><script>window.OCTOBER_KIND="food"</script></body></html>
