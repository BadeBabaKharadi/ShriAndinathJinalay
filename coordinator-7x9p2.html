<!doctype html>
<html lang="hi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>समन्वय कक्ष</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/coordinator.css">
</head>

<body>
    <main class="coordinator-shell">
        <div class="coordinator-card">
            <div class="event-eyebrow">आंतरिक उपयोग</div>
            <h1>क्षमावाणी २०२६ — समन्वय कक्ष</h1>
            <p>QR स्कैन करके आवेदन सत्यापित करें और भौतिक टोकन जारी होने की एंट्री करें।</p>
            <div id="scanner" class="scanner"></div>
            <div class="manual-row"><input id="manual-code" type="text" placeholder="आवेदन कोड"
                    autocomplete="off"><button id="manual-button" class="button primary" type="button">जाँचें</button>
            </div>
            <div id="status" class="status" role="status">स्कैन की प्रतीक्षा है…</div>
            <section id="result" class="result hidden" aria-live="polite"></section>
        </div>
    </main>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="js/coordinator.js"></script>
</body>

</html>
