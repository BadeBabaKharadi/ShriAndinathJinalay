<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रतिभा सम्मान — व्यवस्थापन</title><link rel="stylesheet" href="css/style.css"><style>
body{font-family:"Noto Sans Devanagari",sans-serif;background:#f6f4ef}.wrap{max-width:1200px;margin:25px auto;padding:15px}.card{background:#fff;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}.stat{padding:18px;border-radius:12px;background:#fff8e7}.stat strong{display:block;font-size:28px}.button{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#7b3f00;color:#fff}.secondary{background:#eee}.danger{background:#a22;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,textarea,select{padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;box-sizing:border-box;width:100%}.table{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}.hidden{display:none}.msg{padding:10px;border-radius:8px;margin:10px 0}.error{background:#fee;color:#900}.ok{background:#efe;color:#174}.thumb{width:90px;height:90px;object-fit:cover;border-radius:8px}.details{background:#fafafa;padding:15px;border-radius:10px}.rule{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;margin:8px 0}.status{font-weight:700}
</style></head><body><main class="wrap"><div class="card"><h1>🔐 प्रतिभा सम्मान — व्यवस्थापन</h1><p>यह पृष्ठ केवल अधिकृत व्यवस्थापक के लिए है।</p><div id="login"><label>व्यवस्थापक पासवर्ड</label><input id="key" type="password" autocomplete="current-password"><button id="unlock" class="button primary" style="margin-top:10px">प्रवेश करें</button><div id="loginMsg"></div></div></div>
<section id="app" class="hidden"><div class="grid"><div class="stat">कुल आवेदन<strong id="total">—</strong></div><div class="stat">समीक्षा आवश्यक<strong id="needs">—</strong></div><div class="stat">चयनित<strong id="selected">—</strong></div><div class="stat">चयनित नहीं<strong id="notSelected">—</strong></div></div>
<div class="card"><div class="row"><h2 style="flex:1">आवेदन</h2><button class="button secondary" id="export">CSV निर्यात</button><button class="button secondary" id="refresh">ताज़ा करें</button></div><div class="row"><input id="filter" placeholder="नाम / मोबाइल / शहर / विद्यालय से खोजें"><select id="status"><option value="">सभी स्थिति</option><option>SUBMITTED</option><option>UNDER_REVIEW</option><option>CONSIDERED_FOR_SAMMAN</option><option>NOT_SELECTED</option><option>CLARIFICATION_REQUIRED</option><option>REJECTED</option></select><button class="button secondary" id="search">खोजें</button></div><div class="table"><table><thead><tr><th>आवेदन</th><th>फोटो</th><th>नाम</th><th>विद्यालय</th><th>प्रतिशत</th><th>स्थिति</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="card"><h2>आवेदन विवरण</h2><div id="detail" class="muted">किसी आवेदन को खोलें।</div></div>
<div class="card"><h2>आवेदन कॉन्फ़िगरेशन</h2><div class="grid"><div><label>फॉर्म चालू</label><select id="enabled"><option value="true">हाँ</option><option value="false">नहीं — रोकें</option></select></div><div><label>फॉर्म शुरू होने की तिथि/समय</label><input id="opensAt" type="datetime-local"></div><div><label>पंजीकरण अंतिम तिथि/समय</label><input id="lastDate" type="datetime-local"></div><div><label>कार्यक्रम की तिथि</label><input id="eventDate" type="date"></div></div><label>विवरण</label><textarea id="description"></textarea><button class="button primary" id="saveConfig" style="margin-top:10px">कॉन्फ़िगरेशन सहेजें</button><div id="saveMessage"></div><h3>आवेदन के नियम</h3><div id="rules"></div><div class="row"><input id="newRule" placeholder="हिंदी में नियम लिखें"><input id="ruleOrder" type="number" value="1" style="max-width:100px"><button class="button primary" id="addRule">नियम जोड़ें</button></div></div></section></main><script src="js/pratibha-admin-5h8k2.js"></script></body></html>
