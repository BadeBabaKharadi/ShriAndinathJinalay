<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>बूथ पंजीकरण प्रशासन</title><link rel="stylesheet" href="css/style.css"><style>body{font-family:Arial,sans-serif;background:#faf7f1;color:#38271c}.wrap{max-width:1200px;margin:2rem auto;padding:1rem}.card{background:#fff;border:1px solid #eadfce;border-radius:14px;padding:1rem;margin:1rem 0;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:.75rem}.stat{background:#fff5df;padding:1rem;border-radius:10px}.stat strong{display:block;font-size:1.6rem}.btn{background:#70401e;color:white;border:0;border-radius:7px;padding:.6rem .8rem;margin:.2rem;cursor:pointer}.btn:disabled{opacity:.5}input,select{padding:.7rem;border:1px solid #c9c0b6;border-radius:7px;max-width:100%}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:.7rem;border-bottom:1px solid #eadfce;text-align:left;vertical-align:top}img.receipt{max-width:260px;max-height:300px;display:block}#msg{white-space:pre-wrap;background:#fff3d8;padding:.7rem;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:.5rem}}</style></head><body><main class="wrap"><h1>बूथ पंजीकरण — Admin</h1><p>केवल अधिकृत आयोजक के लिए। भुगतान रसीद देखकर ही सत्यापन करें।</p><section class="card"><label>Admin access key <input id="key" type="password" autocomplete="current-password"></label><button id="login" class="btn">प्रमाणित करें</button><button id="refresh" class="btn" disabled>रीफ़्रेश</button><button id="export" class="btn" disabled>CSV Export</button><div id="msg" role="status" aria-live="polite"></div></section><section class="card"><div class="grid"><div class="stat">कुल आवेदन<strong id="total">—</strong></div><div class="stat">सक्रिय<strong id="active">—</strong></div><div class="stat">उपलब्ध बूथ<strong id="available">—</strong></div><div class="stat">शुल्क<strong>₹2,100</strong></div></div><p>अधिकतम 20 बूथ। Disable किए गए आवेदन उपलब्ध क्षमता में वापस गिने जाएंगे।</p></section><section class="card"><label>स्थिति फ़िल्टर <select id="filter"><option value="all">सभी</option><option value="pending">भुगतान लंबित</option><option value="verified">भुगतान सत्यापित</option><option value="disabled">निष्क्रिय</option></select></label><div style="overflow:auto"><table><thead><tr><th>नाम / मोबाइल</th><th>स्टॉल</th><th>व्यवसाय</th><th>सोसाइटी / शहर / राज्य</th><th>रसीद</th><th>स्थिति</th><th>कार्रवाई</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="js/booth-config.js"></script><script src="js/booth-admin.js"></script></body></html>
