name: Inspect PR 112 formatting
on:
  push:
    branches: [feat/stay-food-admin-dashboard]
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier changes without modifying the branch
        run: |
          npx prettier --write functions/test/event-registration.test.js tests/ui/october-event-admin.spec.js
          git diff --no-ext-diff -- functions/test/event-registration.test.js tests/ui/october-event-admin.spec.js
