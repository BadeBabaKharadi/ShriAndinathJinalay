name: One-time PR 112 formatter repair
on:
  push:
    branches:
      - feat/stay-food-admin-dashboard
    paths:
      - .github/workflows/format-pr112-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message == 'ci: add one-time formatter repair for PR 112'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stay-food-admin-dashboard
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write functions/test/event-registration.test.js tests/ui/october-event-admin.spec.js
      - name: Commit formatted files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/test/event-registration.test.js tests/ui/october-event-admin.spec.js
          rm .github/workflows/format-pr112-once.yml
          git add .github/workflows/format-pr112-once.yml
          git commit -m "style: format PR 112 regression tests"
          git push origin HEAD:feat/stay-food-admin-dashboard
