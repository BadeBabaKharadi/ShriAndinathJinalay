name: Temporary Prettier Fix

on:
  push:
    branches:
      - feat/kshamawani-coordinator-firebase-admin

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write functions/admin.js functions/index.js functions/test/admin.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/admin.js functions/index.js functions/test/admin.test.js
          git diff --cached --quiet || git commit -m "style: apply Prettier formatting"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
