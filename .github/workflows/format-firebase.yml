name: Temporary Firebase formatting

on:
  push:
    branches:
      - feat/kshamawani-firebase-registration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write firebase.json firestore.indexes.json 'functions/**/*.js' 'functions/package.json' 'migration/**/*.mjs' 'migration/package.json' 'tests/ui/registration.spec.js' 'tests/unit/kshamawani-firebase.test.js' 'tests/unit/kshamawani-data.test.js'
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add firebase.json firestore.indexes.json functions migration tests
          git commit -m "style: format Firebase registration files"
          git push origin HEAD:${{ github.ref_name }}
