<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>आवास व्यवस्थापक</title><link rel="stylesheet" href="css/style.css"><style>
main{max-width:1400px;margin:2rem auto;padding:1rem}.card{padding:1.25rem;margin:1rem 0;background:var(--white,#fff);border:1px solid var(--line,#e8dcc8);border-radius:16px;box-shadow:0 8px 24px var(--shadow,rgba(0,0,0,.06))}input,button{padding:.7rem;margin:.3rem;border-radius:8px;font:inherit}button{cursor:pointer;border:1px solid var(--line-strong,#cbb083);background:var(--bg-soft,#f9f2e8);color:var(--maroon,#6e1a14);font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:.6rem;border-bottom:1px solid var(--line,#ddd);text-align:left;vertical-align:top}.scroll{overflow:auto}#summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:1rem 0}.event-stat{padding:1rem;border-radius:12px;background:linear-gradient(135deg,#fffdf9,#fce8c9);border:1px solid var(--line,#e8dcc8)}.event-stat span{display:block;color:var(--text-soft,#6b4f36);font-size:.9rem}.event-stat strong{display:block;font-size:1.8rem;color:var(--maroon,#6e1a14)}#msg{overflow-wrap:anywhere}body{padding-bottom:90px}#navbar{margin-bottom:1rem}#footer{margin-top:2rem}.filters{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}.filters input{min-width:140px;max-width:220px}.details-panel{padding:.5rem;background:#fffdf8;border:1px solid #eadfcf;border-radius:10px}.details-panel table{max-width:900px}.details-panel th{width:30%;color:var(--maroon,#6e1a14)}#dayStats{margin-top:1rem}@media(max-width:600px){main{padding:.6rem}h1{font-size:1.5rem}.card{padding:.8rem}.filters input{flex:1;min-width:130px}}
</style></head><body><div id="navbar"></div><main><h1>आवास पंजीकरण — व्यवस्थापक</h1><section class="card" id="authCard"><label>व्यवस्थापक कुंजी <input type="password" id="key" autocomplete="current-password"></label><button id="login">सत्यापित करें</button><p id="msg" role="status"></p></section><p id="authSuccess" hidden role="status" style="color:#16803c;font-size:1.1rem;font-weight:700">✓ व्यवस्थापक कुंजी सत्यापित</p><section class="card"><div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.75rem"><strong>डेटा डाउनलोड:</strong><button id="exportExcel" type="button">Excel डाउनलोड</button><button id="exportCsv" type="button">CSV डाउनलोड</button></div><div class="filters"><input id="filter" placeholder="नाम, स्थान, मोबाइल या पता"><input id="maleFilter" type="number" min="0" placeholder="पुरुष संख्या"><input id="femaleFilter" type="number" min="0" placeholder="महिला संख्या"><input id="childrenFilter" type="number" min="0" placeholder="बच्चे संख्या"><input id="dateFilter" type="date" aria-label="चेक-इन/आउट तारीख"></div><button id="refresh">रजिस्ट्रेशन देखें</button><p id="summary"></p><section id="dayStats"></section><div class="scroll"><table><thead><tr><th>रजिस्ट्रेशन</th><th>नाम</th><th>मोबाइल</th><th>पता</th><th>आने का स्थान</th><th>पुरुष</th><th>महिलाएँ</th><th>बच्चे</th><th>चेक-इन</th><th>चेक-आउट</th><th>विवरण</th><th>आधार</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="footer"></div><script src="js/components.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" referrerpolicy="no-referrer"></script><script>window.OCTOBER_KIND="stay"</script><script src="js/october-event-admin.js"></script></body></html>
